<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>视野共享</title>
<style>
  :root{
    --bg:#161b20; --panel:#1f262d; --panel2:#252e36; --line:#313b45;
    --txt:#e7edf2; --sub:#9aa7b2; --blue:#3a93f5; --red:#f0533f; --gold:#ffb800; --green:#1fb577;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  .app{display:flex;min-height:100%;}
  .left{flex:1;padding:14px;min-width:0;display:flex;flex-direction:column;gap:12px;}
  .right{width:380px;max-width:42vw;padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;}
  .card h3{margin:0 0 10px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
  /* 顶上技能面板(地图上方) */
  .topbar{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;}
  .topbar .head{display:flex;align-items:center;margin-bottom:8px;gap:8px;}
  .topbar .title{font-size:14px;font-weight:600;}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto;}
  .seg button{border:none;background:transparent;color:var(--sub);padding:6px 14px;font-size:13px;font-weight:600;}
  .seg button.on{background:var(--blue);color:#fff;}
  .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .cell .av{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--line);}
  .cell .av.blue{border-color:var(--blue);} .cell .av.red{border-color:var(--red);}
  .slot{position:relative;width:48px;height:48px;}
  .slot img{width:48px;height:48px;border-radius:9px;object-fit:cover;display:block;}
  .slot .mask{position:absolute;inset:0;border-radius:9px;background:rgba(10,13,16,.62);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#ffd98a;}
  .slot .mask.hide{display:none;}
  .map-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;min-height:0;}
  #myCanvas{width:auto;height:auto;max-width:100%;max-height:70vh;aspect-ratio:1/1;border-radius:8px;}
  input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:9px 11px;font-size:14px;width:100%;outline:none;}
  input:focus{border-color:var(--blue);}
  .btn{border:none;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;background:var(--blue);}
  .btn.gray{background:#3a444e;}
  .btn:active{opacity:.85;}
  .row{display:flex;gap:8px;align-items:center;}
  .status{font-size:12.5px;color:var(--sub);}
  .home-item{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel2);}
  .home-item.active{border-color:var(--blue);background:linear-gradient(90deg,rgba(58,147,245,.16),rgba(240,83,63,.12));}
  .home-item .nm{font-size:14px;font-weight:600;}
  /* 校准分组 */
  .offgroup{margin-top:8px;}
  .offgroup .lab{font-size:12.5px;color:var(--sub);margin:6px 0 2px;display:flex;justify-content:space-between;}
  .offgroup input[type=range]{width:100%;}
  .offgroup .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .mask2{position:fixed;inset:0;background:rgba(14,18,22,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .mask2 .box{width:420px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;}
  .mask2 h2{margin:0 0 6px;font-size:19px;}
  .mask2 p{color:var(--sub);font-size:13px;margin:0 0 16px;line-height:1.6;}
  @media (max-width:860px){
    .app{flex-direction:column;}
    .right{width:100%;max-width:none;}
    #myCanvas{max-height:48vh;}
    .cell .av{width:44px;height:44px;} .slot,.slot img{width:40px;height:40px;}
  }
</style>
</head>
<body>

<div class="mask2" id="addrMask">
  <div class="box">
    <h2>连接共享服务器</h2>
    <p>请输入你部署的共享服务器地址（IP 或域名 + 端口）。地址仅保存在你本机浏览器，不会内置任何服务器。</p>
    <input type="text" id="addrInput" placeholder="例如 1.2.3.4:8888" autocomplete="off">
    <div class="row" style="margin-top:12px;"><button class="btn" id="addrBtn" style="flex:1;">连接</button></div>
    <div class="status" id="addrStatus" style="margin-top:10px;"></div>
  </div>
</div>

<div class="app">
  <div class="left">

    <!-- 顶上技能: 5人横向, 头像/大招/召唤师 三排 -->
    <div class="topbar">
      <div class="head">
        <span class="title">人物技能</span>
        <div class="seg">
          <button id="campRed" class="on">敌方</button>
          <button id="campBlue">我方</button>
        </div>
      </div>
      <div class="grid5" id="topGrid"></div>
    </div>

    <div class="map-wrap">
      <canvas id="myCanvas" width="1000" height="1000"></canvas>
    </div>
  </div>

  <div class="right">
    <!-- 地图校准(地图下面, 服务器上面) -->
    <div class="card">
      <h3>地图校准</h3>
      <div class="status">头像 / 野怪 / 兵线可分别微调，自动保存。</div>

      <div class="offgroup">
        <div class="lab">全局缩放 <span id="zoomV">1.00</span></div>
        <input type="range" id="zoomR" min="0.6" max="1.4" step="0.01">
      </div>

      <div class="offgroup">
        <div class="lab">头像偏移</div>
        <div class="pair">
          <div><div class="lab">X <span id="pxV">0</span></div><input type="range" id="pxR" min="-80" max="80" step="1"></div>
          <div><div class="lab">Y <span id="pyV">0</span></div><input type="range" id="pyR" min="-80" max="80" step="1"></div>
        </div>
      </div>

      <div class="offgroup">
        <div class="lab">野怪偏移</div>
        <div class="pair">
          <div><div class="lab">X <span id="jxV">0</span></div><input type="range" id="jxR" min="-80" max="80" step="1"></div>
          <div><div class="lab">Y <span id="jyV">0</span></div><input type="range" id="jyR" min="-80" max="80" step="1"></div>
        </div>
      </div>

      <div class="offgroup">
        <div class="lab">兵线偏移</div>
        <div class="pair">
          <div><div class="lab">X <span id="bxV">0</span></div><input type="range" id="bxR" min="-80" max="80" step="1"></div>
          <div><div class="lab">Y <span id="byV">0</span></div><input type="range" id="byR" min="-80" max="80" step="1"></div>
        </div>
      </div>

      <div class="row" style="margin-top:10px;"><button class="btn gray" id="calReset" style="flex:1;">恢复默认</button></div>
    </div>

    <div class="card">
      <h3><span class="dot" id="srvDot"></span>服务器 <span class="badge" id="srvAddr" style="margin-left:auto;"></span></h3>
      <div class="status" id="srvState">未连接</div>
      <div class="row" style="margin-top:10px;">
        <button class="btn gray" id="reconnectBtn">重连</button>
        <button class="btn gray" id="changeAddrBtn">改地址</button>
      </div>
    </div>

    <div class="card">
      <h3>房间 <span class="badge" id="curHome" style="margin-left:auto;">未连接房间</span></h3>
      <div class="row">
        <input type="text" id="homeIdInput" placeholder="输入房间名称后连接">
        <button class="btn" id="linkHome">连接</button>
      </div>
      <div class="status" style="margin-top:10px;">在线房间（点击进入）</div>
      <div id="homeList" style="margin-top:8px;"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var canvas=$("myCanvas"), ctx=canvas.getContext("2d");
  var W=1000, C=500, R=470;
  var RC=158.6, RS=179.3;

  // ===== 校准(本地) =====
  var cal=JSON.parse(localStorage.getItem("radarCal2")||'{}');
  function d(v){return (v===undefined)?0:v;}
  cal.zoom=cal.zoom||1;
  cal.px=d(cal.px);cal.py=d(cal.py);cal.jx=d(cal.jx);cal.jy=d(cal.jy);cal.bx=d(cal.bx);cal.by=d(cal.by);
  function saveCal(){localStorage.setItem("radarCal2",JSON.stringify(cal));}
  function bindR(slider,txt,key,fmt){
    $(slider).value=cal[key];$(txt).textContent=fmt?fmt(cal[key]):cal[key];
    $(slider).addEventListener('input',function(){cal[key]=parseFloat(this.value);
      $(txt).textContent=fmt?fmt(cal[key]):cal[key];saveCal();});
  }
  bindR('zoomR','zoomV','zoom',function(v){return Number(v).toFixed(2);});
  bindR('pxR','pxV','px');bindR('pyR','pyV','py');
  bindR('jxR','jxV','jx');bindR('jyR','jyV','jy');
  bindR('bxR','bxV','bx');bindR('byR','byV','by');
  $("calReset").onclick=function(){
    cal={zoom:1,px:0,py:0,jx:0,jy:0,bx:0,by:0};saveCal();fillCalUI();};
  function fillCalUI(){
    $("zoomR").value=1;$("zoomV").textContent="1.00";
    [['pxR','pxV'],['pyR','pyV'],['jxR','jxV'],['jyR','jyV'],['bxR','bxV'],['byR','byV']].forEach(function(a){
      $(a[0]).value=0;$(a[1]).textContent="0";});
  };

  // 坐标映射 + 各类独立偏移
  function mx(x,kind){var rc=(kind==='s')?RS:RC;return (x-rc)/rc*R*cal.zoom+C;}
  function my(y,kind){var rc=(kind==='s')?RS:RC;return (y-rc)/rc*R*cal.zoom+C;}

  // ===== 图标URL =====
  function uAvatar(h){return "https://game.gtimg.cn/images/yxzj/img201606/heroimg/"+h+"/"+h+".jpg";}
  function uUlt(h){return "https://game.gtimg.cn/images/yxzj/img201606/heroimg/"+h+"/"+h+"30.png";}
  function uSum(tb){return "https://game.gtimg.cn/images/yxzj/img201606/summonero/"+tb+".png";}

  // ===== 状态 =====
  var socket=null, homeId="", 英雄信息=[], timers=[], showCamp=2;
  function setSrv(ok,txt){$("srvState").textContent=txt;
    $("srvDot").style.background=ok?'var(--green)':'var(--red)';}
  function clearTimers(){timers.forEach(clearInterval);timers=[];}

  // ===== WebSocket =====
  function connect(addr){
    try{if(socket){socket.onclose=null;socket.close();}}catch(e){}
    $("srvAddr").textContent=addr;setSrv(false,"连接中…");
    socket=new WebSocket("ws://"+addr+"/ws");
    socket.onopen=function(){setSrv(true,"已连接");clearTimers();
      timers.push(setInterval(getHome,1000));timers.push(setInterval(getGame,70));
      timers.push(setInterval(渲染顶上,400));getHome();};
    socket.onmessage=function(e){var d=e.data.split("##");
      if(d[0]==="homeData"){渲染房间(d[1]);}
      else if(d[0]==="gameData"){
        var p=d[1].split("---");
        英雄信息=(p[0]||"").split("==").filter(function(s){return s;}).map(function(s){return s.split(",");});
        draw(p);
      }};
    socket.onclose=function(){setSrv(false,"已断开");clearTimers();};
    socket.onerror=function(){setSrv(false,"连接错误");};
  }
  function send(m){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(m);}
  function getHome(){send("getHome");}
  function getGame(){if(homeId)send("web"+Date.now()+"[==]"+homeId);}

  // ===== 房间列表 =====
  function 渲染房间(str){
    var ids=(str||"").split(",").filter(function(s){return s;});
    var box=$("homeList");box.innerHTML="";
    ids.forEach(function(id){var div=document.createElement("div");
      div.className="home-item"+(id===homeId?" active":"");
      div.innerHTML='<span class="nm">'+id+'</span><span class="badge">进入</span>';
      div.onclick=function(){homeId=id;$("curHome").textContent=id;渲染房间(str);};
      box.appendChild(div);});
  }

  // ===== 顶上技能面板(5列3排, 图片) =====
  function 渲染顶上(){
    var list=英雄信息.filter(function(rw){return rw.length>10&&Number(rw[8])===showCamp;}).slice(0,5);
    var g=$("topGrid");g.innerHTML="";
    list.forEach(function(rw){
      var h=rw[0], ultCd=Number(rw[3]), sumCd=Number(rw[4]), tb=rw[10];
      var campCls=showCamp===1?'blue':'red';
      var cell=document.createElement("div");cell.className="cell";
      cell.innerHTML='<img class="av '+campCls+'" src="'+uAvatar(h)+'">'
        + slotHtml(uUlt(h),ultCd)
        + slotHtml(uSum(tb),sumCd,true);
      g.appendChild(cell);
    });
  }
  function slotHtml(src,cd,fallback){
    var shown=(cd&&cd>0)?cd:"";
    var oe=fallback?' onerror="this.onerror=null;this.src=this.src.replace(\'summonero/\',\'summoner/\').replace(\'.png\',\'.jpg\')"':"";
    return '<div class="slot"><img src="'+src+'"'+oe+'>'
      +'<div class="mask'+(shown?'':' hide')+'">'+shown+'</div></div>';
  }

  // ===== 地图绘制 =====
  function draw(p){
    ctx.clearRect(0,0,W,W);
    if(baseReady)ctx.drawImage(baseCanvas,0,0,W,W);
    else{ctx.fillStyle="#22302a";ctx.fillRect(0,0,W,W);}
    // 技能轨迹
    (p[3]||"").split("==").forEach(function(s){
      var r=s.split(",");if(r.length<4)return;
      var x1=mx(+r[0],'c'),y1=my(+r[1],'c'),x2=mx(+r[2],'c'),y2=my(+r[3],'c');
      if(!isFinite(x1)||!isFinite(x2))return;
      ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.lineWidth=16;ctx.strokeStyle="rgba(104,98,232,.30)";ctx.stroke();
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.lineWidth=3;ctx.strokeStyle="rgba(242,244,255,.92)";ctx.stroke();
      var ang=Math.atan2(y2-y1,x2-x1),ax=(x1+x2)/2,ay=(y1+y2)/2;
      ctx.beginPath();
      ctx.moveTo(ax+Math.cos(ang)*14,ay+Math.sin(ang)*14);
      ctx.lineTo(ax+Math.cos(ang+2.5)*11,ay+Math.sin(ang+2.5)*11);
      ctx.lineTo(ax+Math.cos(ang-2.5)*11,ay+Math.sin(ang-2.5)*11);
      ctx.closePath();ctx.fillStyle="rgba(242,244,255,.95)";ctx.fill();
    });
    // 兵线(独立偏移)
    (p[2]||"").split("==").forEach(function(s){
      var b=s.split(",");if(b.length<3)return;
      var x=mx(+b[0],'s')+cal.bx,y=my(+b[1],'s')+cal.by;
      ctx.beginPath();ctx.arc(x,y,9,0,7);
      ctx.fillStyle=(+b[2]===1)?"#3a93f5":"#f0533f";ctx.fill();});
    // 野怪(独立偏移)
    (p[1]||"").split("==").forEach(function(s){
      var g=s.split(",");if(g.length<5)return;
      var x=mx(+g[3],'c')+cal.jx,y=my(+g[4],'c')+cal.jy,cd=+g[1];
      if(cd>0){ctx.fillStyle="#ffb800";ctx.font="26px sans-serif";ctx.textAlign="center";ctx.fillText(cd,x,y+9);}
      else{ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fillStyle="#ffb800";ctx.fill();}});
    // 英雄(头像偏移)
    英雄信息.forEach(function(rw){
      if(rw.length<9||!rw[0])return;
      var x=mx(+rw[5],'c')+cal.px,y=my(+rw[6],'c')+cal.py;
      var camp=+rw[8],hp=+rw[7],av=34,key=rw[0];
      var rac=roundAvatar(key);
      if(rac)ctx.drawImage(rac,x-av,y-av,av*2,av*2);
      else{ctx.save();ctx.beginPath();ctx.arc(x,y,av,0,7);ctx.closePath();ctx.clip();
        ctx.fillStyle="#444";ctx.fillRect(x-av,y-av,av*2,av*2);ctx.restore();}
      ctx.beginPath();ctx.arc(x,y,av,0,7);ctx.lineWidth=4;
      ctx.strokeStyle=(camp===1)?"#3a93f5":"#f0533f";ctx.stroke();
      var bw=72,bx=x-bw/2,by=y+av+8,w=Math.max(0,Math.min(100,hp))/100*bw;
      ctx.fillStyle="rgba(255,255,255,.35)";ctx.fillRect(bx,by,bw,6);
      ctx.fillStyle=(camp===1)?"#1fb577":"#f0533f";ctx.fillRect(bx,by,w,6);
      if(+rw[9]===1){ctx.fillStyle="#b06ff2";ctx.font="bold 22px sans-serif";
        ctx.textAlign="center";ctx.fillText("回城",x,y-av-12);}
    });
  }
  var heroCache={}, avatarRound={};
  // 底图离屏缓存(1:1, 避免每帧重绘大图)
  var baseCanvas=document.createElement('canvas');baseCanvas.width=W;baseCanvas.height=W;
  var bctx=baseCanvas.getContext('2d'),baseReady=false;
  var mapImg=new Image();
  mapImg.onload=function(){bctx.drawImage(mapImg,0,0,W,W);baseReady=true;};
  mapImg.src="map.png";
  // 圆形头像缓存(图片就绪后生成离屏圆图, 免去每帧clip)
  function roundAvatar(key){
    if(avatarRound[key])return avatarRound[key];
    var im=heroCache[key];
    if(!im){im=heroCache[key]=new Image();im.onload=function(){avatarRound[key]=null;};im.src=uAvatar(key);}
    if(im.complete&&im.naturalWidth){
      var c=document.createElement('canvas');c.width=136;c.height=136;var cc=c.getContext('2d');
      cc.beginPath();cc.arc(68,68,68,0,7);cc.clip();cc.drawImage(im,0,0,136,136);
      avatarRound[key]=c;return c;
    }
    return null;
  }

  // 阵营切换
  $("campRed").onclick=function(){showCamp=2;$("campRed").className="on";$("campBlue").className="";渲染顶上();};
  $("campBlue").onclick=function(){showCamp=1;$("campBlue").className="on";$("campRed").className="";渲染顶上();};

  // 手动连接房间
  $("linkHome").onclick=function(){var v=$("homeIdInput").value.trim();
    if(v){homeId=v;$("curHome").textContent=v;getHome();}};

  // 服务器地址
  var savedAddr=localStorage.getItem("radarAddr")||"";
  if(savedAddr)$("addrInput").value=savedAddr;
  function tryConnect(){var v=$("addrInput").value.trim()
      .replace(/^https?:\/\//,'').replace(/\/ws\/?$/,'');
    if(!v){$("addrStatus").textContent="请输入地址";return;}
    if(v.indexOf(":")<0)v=v+":8888";
    localStorage.setItem("radarAddr",v);
    $("addrMask").style.display="none";connect(v);}
  $("addrBtn").onclick=tryConnect;
  $("addrInput").addEventListener('keydown',function(e){if(e.keyCode===13)tryConnect();});
  $("reconnectBtn").onclick=function(){connect(localStorage.getItem("radarAddr"));};
  $("changeAddrBtn").onclick=function(){$("addrMask").style.display="flex";};
  if(savedAddr){$("addrMask").style.display="none";connect(savedAddr);}
})();
</script>
</body>
</html>
